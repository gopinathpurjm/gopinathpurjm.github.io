<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#062f27"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="apple-touch-icon.png"><title>গোপীনাথপুর জামে মসজিদ</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--a:#6fa8ff;--a1:#a9c8ff;--a2:#4d8dff;--bt:#04112e;--ar:111,168,255;--bg0:#040816;--bgi:radial-gradient(900px 520px at 88% -8%,rgba(104,72,255,.30),transparent 62%),radial-gradient(700px 520px at -12% 34%,rgba(28,112,255,.22),transparent 62%),#040816;--o1:#4d8dff;--o2:#7c5cff;--o3:#2b6bff;--tc:#0a1a3d;--tcr:10,26,61;--fs:#050a22}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

main{position:relative;z-index:1;max-width:520px;margin:auto;padding:calc(env(safe-area-inset-top,0px) + 22px) 18px 130px;display:flex;flex-direction:column;gap:16px}
.g{position:relative;background:linear-gradient(145deg,rgba(255,255,255,.2),rgba(255,255,255,.04) 60%,rgba(255,255,255,.1));backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);border-radius:26px;box-shadow:0 18px 50px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.4)}
.g::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(135deg,rgba(255,255,255,.8),rgba(255,255,255,.06) 38%,rgba(255,255,255,.06) 62%,rgba(255,255,255,.45));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.c{padding:20px;display:flex;flex-direction:column;gap:12px;animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.na .c,.na .hero{animation:none}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}

.hd{display:flex;align-items:center;gap:10px}.bd{width:34px;height:34px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(var(--ar),.18);color:var(--a);border:1px solid rgba(var(--ar),.35);flex:none}

.x{background:none;border:0;color:#ffb4a8;padding:2px 6px;font-size:14px}.x.ok{color:#7af0cf}.x.gd{color:var(--a)}
.in{color:#7af0cf}.out{color:#ffb4a8}
.bar{height:9px;border-radius:9px;background:rgba(255,255,255,.14);overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--a),var(--a2));transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.seg{display:flex;padding:4px;border-radius:18px;background:rgba(0,0,0,.28)}.seg button{flex:1;padding:10px;border:0;background:none;border-radius:14px;font-weight:600}.seg .on{background:rgba(var(--ar),.3)}
#nav{position:fixed;left:16px;right:16px;bottom:max(18px,env(safe-area-inset-bottom));max-width:488px;margin:auto;height:66px;border-radius:33px;z-index:5;display:flex}

#ov{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(2,12,14,.62);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}#ov.s{display:flex}
.box{width:100%;max-width:420px;padding:24px;display:flex;flex-direction:column;gap:14px;max-height:88vh;overflow:auto;animation:pop .5s cubic-bezier(.3,1.8,.5,1)}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:rgba(255,255,255,.8);margin-bottom:10px}

input,select,textarea{padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.28);background:rgba(0,0,0,.28);color:#fff;font-size:15px}select option{color:#000}
input[type=checkbox]{width:20px;height:20px;padding:0;flex:none;accent-color:var(--a2)}
.r2{display:flex;gap:10px}.r2>*{flex:1}
#tt{position:fixed;left:24px;right:24px;bottom:100px;z-index:30;max-width:460px;margin:auto;padding:13px 18px;border-radius:20px;background:rgba(var(--tcr),.92);border:1px solid rgba(255,255,255,.3);text-align:center;font-weight:600;opacity:0;transform:translateY(20px);transition:.4s;pointer-events:none}#tt.s{opacity:1;transform:none}
.big{font-size:46px;font-weight:700;line-height:1.1}.pulse{animation:pl 2.4s infinite}
.hero{position:relative;isolation:isolate;border-radius:26px;overflow:hidden;aspect-ratio:16/11;background:var(--hg,linear-gradient(180deg,var(--tc),var(--o1) 55%,var(--a) 85%,var(--tc)));border:1px solid rgba(255,255,255,.3);box-shadow:0 18px 50px rgba(0,0,0,.35);animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.hero::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.9;background-image:radial-gradient(1.4px 1.4px at 12% 14%,#fff,transparent),radial-gradient(1px 1px at 28% 30%,#fff,transparent),radial-gradient(1.4px 1.4px at 44% 10%,#fff,transparent),radial-gradient(1px 1px at 58% 24%,#fff,transparent),radial-gradient(1.2px 1.2px at 72% 8%,#fff,transparent),radial-gradient(1px 1px at 88% 34%,#fff,transparent),radial-gradient(1px 1px at 6% 40%,#fff,transparent),radial-gradient(1.2px 1.2px at 36% 44%,#fff,transparent);-webkit-mask-image:linear-gradient(180deg,#000,transparent 70%);mask-image:linear-gradient(180deg,#000,transparent 70%)}
.hero img{position:absolute;left:0;bottom:0;z-index:1;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;display:block;mix-blend-mode:luminosity;filter:brightness(.62);-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 22%);mask-image:linear-gradient(180deg,transparent 0,#000 22%)}
.hero img.hgl{mix-blend-mode:screen;filter:grayscale(1) brightness(.606) contrast(3) sepia(1) saturate(2.5) hue-rotate(-8deg);opacity:.55}
.hero::after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(0,0,0,.25) 0,rgba(0,0,0,0) 30%,rgba(0,0,0,0) 48%,rgba(0,0,0,.8) 100%);pointer-events:none}
.hv{position:absolute;left:16px;right:70px;bottom:12px;z-index:2;text-shadow:0 2px 12px rgba(0,0,0,.65)}
.hero .bl.if{right:66px}
.hero .bl{position:absolute;top:16px;right:14px;z-index:2;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(3,24,26,.5);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;color:var(--a)}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{padding:14px 12px;border-radius:16px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);display:flex;align-items:center;gap:10px;text-align:left;font-size:14px;line-height:1.3}.tile svg{color:var(--a);flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chip{font-size:11px;padding:3px 9px;border-radius:99px;background:rgba(var(--ar),.16);border:1px solid rgba(var(--ar),.3);color:var(--a)}
.chip.off{background:rgba(255,180,168,.14);border-color:rgba(255,180,168,.35);color:#ffb4a8}
.av{width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.4);flex:none;object-fit:cover}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}@keyframes dr{to{transform:translate(50px,70px) scale(1.25)}}@keyframes pl{50%{box-shadow:0 0 0 10px rgba(var(--ar),0)}0%{box-shadow:0 0 0 0 rgba(var(--ar),.5)}}
.brand{display:none}#nav .dk{display:none}
@media(hover:hover){.pill:hover,.ghost:hover,.tile:hover,.li:hover{background:rgba(255,255,255,.16)}.btn:hover{filter:brightness(1.07)}#nav button:hover{background:rgba(255,255,255,.1)}}
@media(min-width:600px) and (max-width:899px){main{max-width:640px}}
/* পিসি/ট্যাবলেট: বাঁ দিকে সাইডবার, ডান দিকে কার্ডের গ্রিড */
@media(min-width:900px){
main{max-width:1500px;margin:0 auto;padding:36px 36px 40px 304px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-content:start}
.full,.hero,.c.m{grid-column:1/-1}
.hero{aspect-ratio:auto;height:clamp(240px,26vw,360px)}
.hv{left:24px;bottom:18px}.hv>div:last-child{font-size:30px!important}
#nav{left:24px;top:24px;bottom:24px;right:auto;width:240px;max-width:none;margin:0;height:auto;border-radius:28px;flex-direction:column;justify-content:flex-start;padding:18px 14px;gap:6px}
.brand{display:flex;align-items:center;gap:12px;padding:6px 8px 16px;margin-bottom:8px;border-bottom:1px solid rgba(255,255,255,.18)}.brand img{border-radius:12px}
#nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:14px;padding:14px 16px;border-radius:16px;font-size:15px}
#nav button.dk{display:flex;margin-top:auto}
#nav .on{background:rgba(var(--ar),.16)}
#tt{bottom:32px;left:304px;right:36px}
.box{max-width:480px}
}
.box:has(#f){overflow:hidden}#f{overflow-y:auto;max-height:calc(88vh - 110px);display:flex;flex-direction:column;gap:12px}
.fbox{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px;border-radius:20px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.2)}.fbox .fh{grid-column:1/-1;font-weight:700;font-size:16px;color:var(--a)}.fbox label{min-width:0}.fbox input{width:100%}
@media(min-width:1360px){main{grid-template-columns:repeat(3,minmax(0,1fr))}}
/* হোম পেজের পিসি লেআউট: ফাঁকা জায়গা ভরাতে বাড়তি কার্ড ও গ্রিড */
.dko{display:none!important}
@media(min-width:900px){
.dko{display:flex!important}
main{grid-auto-flow:row dense}
.hero{height:clamp(300px,30vw,440px)}
.hero img{top:0;bottom:auto;left:50%;transform:translateX(-50%);width:auto;height:100%;-webkit-mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent)}
.hp-acc{grid-column:1/-1}
.hp-quick .tg{grid-template-columns:repeat(4,1fr)}
}
@media(min-width:1360px){
.hp-next{grid-column:span 1}.hp-pray{grid-column:span 2}
.hp-acc{grid-column:span 2;grid-row:span 3}
.hp-don,.hp-ann,.hp-ev{grid-column:3}
.hp-quick{grid-column:1/-1}.hp-quick .tg{grid-template-columns:repeat(8,1fr)}
}

.ar{font-family:'Amiri','Scheherazade New','Noto Naskh Arabic',serif;direction:rtl;text-align:right}
.qr{--qfz:28px}.qr .ar{font-size:var(--qfz);line-height:2.1}.qr select{width:100%}
.qr .ay{padding:14px 0;border-bottom:1px solid rgba(255,255,255,.14)}
.qr .ay-n{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 6px;border-radius:13px;background:rgba(var(--ar),.2);color:var(--a);font-size:12px;margin-bottom:4px}
.qr .ay-tn{margin-top:6px;font-size:15px;line-height:1.7;color:var(--a);font-style:italic}.qr .ay-tl{margin:6px 0 0;font-size:16px;line-height:1.75}
.qr-bis{text-align:center;font-size:var(--qfz);line-height:2;padding:8px 0}
.tj-key{display:flex;flex-wrap:wrap;gap:6px;font-size:12px}.tj-key .tj{padding:2px 8px;border-radius:10px;background:rgba(0,0,0,.3)}
i.tj{font-style:normal}.tj.ghunnah{color:#ff9f43}.tj.ikhfa,.tj.ikhfa_shafawi{color:#1dd1a1}.tj.idgham_ghunnah,.tj.idgham_wo_ghunnah,.tj.idgham_shafawi,.tj.idgham_mutaqarib{color:#54a0ff}
.tj.iqlab{color:#c56cf0}.tj.qalqalah{color:#feca57}.tj.madda_normal,.tj.madda_permissible,.tj.madda_necessary,.tj.madda_obligatory{color:#ff6b6b}.tj.ham_wasl,.tj.slnt,.tj.laam_shamsiyah{color:#aab}
#fsv{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;background:var(--fs)}
#fsv .fb{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.2);color:#fff}#fsv .fb b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fsv .fb button,#fsv .fb a{width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;font-size:20px;display:grid;place-items:center;text-decoration:none;font-family:inherit}
#fsv iframe{flex:1;border:0;background:#fff;width:100%}
.pv{background:#fff;color:#000;border-radius:12px;padding:14px;max-height:50vh;overflow:auto;font-size:13px}.pv table{width:100%;border-collapse:collapse}.pv td,.pv th{border:1px solid #999;padding:4px;text-align:left}
textarea.cv{width:100%;height:42vh;font-size:12px}

.ct{display:block;margin:0}.ct input{display:none}.ct span{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:16px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);font-size:12px;text-align:center;cursor:pointer;line-height:1.3}
.ct input:checked+span{border-color:var(--a);background:rgba(var(--ar),.22);box-shadow:0 0 14px rgba(var(--ar),.35)}
.cg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}.tk span{flex-direction:row;justify-content:center;font-size:15px;font-weight:600}
#ef[data-k="আয়"] .go,#ef[data-k="ব্যয়"] .gi{display:none}.amt{font-size:28px!important;font-weight:700}
.sm{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sm>div{border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:6px}
.ab3{display:flex;align-items:center;gap:10px}.ab3 .ghost{flex:1;padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:4px}
.pl{width:68px;height:68px;border-radius:50%;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;gap:0;padding:0}

.pg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.pt{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 2px;border-radius:16px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);font-size:11px;text-align:center}
.pt b{font-size:13px}.pt span{color:var(--a);display:flex;margin-bottom:2px}.pt div{font-weight:700;font-size:13px}.pt small{opacity:.8;font-size:10px}
.pt.on{background:rgba(var(--ar),.3);border-color:rgba(var(--ar),.75);box-shadow:0 0 14px rgba(var(--ar),.3)}.pt.on b,.pt.on div{color:var(--a)}

.tile.big{flex-direction:column;justify-content:center;text-align:center;gap:10px;padding:18px 8px}.tile.big>span:last-child{font-size:14px}
.ib{width:54px;height:54px;border-radius:18px;display:flex;align-items:center;justify-content:center;background:rgba(var(--ar),.16);border:1px solid rgba(var(--ar),.45);box-shadow:0 0 16px rgba(var(--ar),.15)}

/* ক্লিক অ্যানিমেশন (রিপল + টোকা) ও গ্লো */
[data-a]{position:relative;overflow:hidden;-webkit-user-select:none;user-select:none}
.rp{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.55),rgba(var(--ar),.28) 55%,rgba(255,255,255,0) 70%);transform:scale(0);opacity:1;pointer-events:none;animation:rpl .65s cubic-bezier(.2,.7,.3,1) forwards}
.btn .rp{background:radial-gradient(circle,rgba(255,255,255,.7),rgba(255,255,255,0) 70%)}
.tap{animation:tap .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes rpl{to{transform:scale(1);opacity:0}}
@keyframes tap{0%{transform:scale(1)}30%{transform:scale(.91)}65%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes glw{0%,100%{filter:drop-shadow(0 0 2px var(--gc))}50%{filter:drop-shadow(0 0 13px var(--gc)) drop-shadow(0 0 4px var(--gc))}}
@keyframes glb{0%,100%{box-shadow:0 0 5px var(--gc),inset 0 0 6px var(--gc2)}50%{box-shadow:0 0 22px var(--gc),inset 0 0 14px var(--gc2)}}
.gl{--gc:rgba(var(--ar),.95);animation:glw 2.6s ease-in-out infinite}
.gb{border-color:var(--gc)!important;animation:glb 2.6s ease-in-out infinite}
.gb svg{--gc:currentColor;animation:glw 2.6s ease-in-out infinite}
.gbi{--gc:rgba(31,209,165,.85);--gc2:rgba(31,209,165,.22)}.gbo{--gc:rgba(255,107,129,.85);--gc2:rgba(255,107,129,.22)}
.gbo{animation-delay:1.3s}.gbo svg{animation-delay:1.3s}
main>*:nth-child(2){animation-delay:.05s}main>*:nth-child(3){animation-delay:.1s}main>*:nth-child(4){animation-delay:.15s}main>*:nth-child(5){animation-delay:.2s}main>*:nth-child(6){animation-delay:.25s}main>*:nth-child(n+7){animation-delay:.3s}

/* ===== রেফারেন্স অ্যাপের ইফেক্ট (সোনালি-সবুজ রঙে) ===== */
@keyframes fxFade{from{opacity:0}to{opacity:1}}

@keyframes fxSheet{from{transform:translateY(46px);opacity:0}to{transform:none;opacity:1}}

@keyframes fxGrow{from{width:0}}
@keyframes fxShine{0%{left:-60%}38%,100%{left:135%}}

@keyframes fxShift{to{background-position:200% 0}}
@keyframes hfScan{0%{top:0;opacity:0}15%{opacity:.9}85%{opacity:.9}100%{top:100%;opacity:0}}
@keyframes hfBl{50%{opacity:.25}}
@keyframes hfSweep{0%{left:-40px}60%,100%{left:105%}}
@keyframes hfFlow{to{background-position:300% 0}}
@keyframes hfTxt{to{background-position:200% center}}
/* পেজ খোলার ঢেউ: মেইন কার্ড */
main>*{animation-name:fxUp}
/* ব্যাকগ্রাউন্ডে হালকা সোনালি গ্রিড */
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;background-image:linear-gradient(rgba(var(--ar),.07) 1px,transparent 1px),linear-gradient(90deg,rgba(var(--ar),.07) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(circle at 50% 0,#000,transparent 72%);mask-image:radial-gradient(circle at 50% 0,#000,transparent 72%)}
/* শাইন, ভাসা, রিং */
.shn{position:relative;overflow:hidden}
.shn::after{content:"";position:absolute;top:0;left:-60%;width:38%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.18),transparent);transform:skewX(-18deg);animation:fxShine 5.5s ease-in-out 1.2s infinite;pointer-events:none}
.gl{animation:glw 2.6s ease-in-out infinite,fxFloat 5.5s ease-in-out infinite}
.ib{animation:fxRingG 2.8s ease-out infinite}
.btn{background:linear-gradient(110deg,var(--a1),var(--a2),var(--a1),var(--a2))!important;background-size:200% 100%!important;animation:fxShift 5s linear infinite}
.btn.pl{animation:fxShift 5s linear infinite,pl 2.4s infinite}
/* নেক্সট নামাজ কার্ড: গ্রিড, কোণা, স্ক্যান লাইন, ব্লিঙ্ক ডট */
.scn{overflow:hidden}
.scn::after{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--a),transparent);animation:hfScan 3.2s linear infinite;pointer-events:none}
.gr{position:absolute;inset:0;border-radius:inherit;pointer-events:none;background-image:linear-gradient(rgba(var(--ar),.12) 1px,transparent 1px),linear-gradient(90deg,rgba(var(--ar),.12) 1px,transparent 1px);background-size:16px 16px;-webkit-mask-image:linear-gradient(120deg,#000,transparent 75%);mask-image:linear-gradient(120deg,#000,transparent 75%)}
.cb{position:absolute;width:16px;height:16px;border:2px solid var(--a);opacity:.85;pointer-events:none}
.cb.tl{left:10px;top:10px;border-right:0;border-bottom:0;border-radius:6px 0 0 0}
.cb.br{right:10px;bottom:10px;border-left:0;border-top:0;border-radius:0 0 6px 0}
.bk{display:inline-block;width:7px;height:7px;border-radius:50%;background:#19e68c;box-shadow:0 0 8px #19e68c;margin-right:6px;animation:hfBl 1.6s ease-in-out infinite}
.hp-next svg{--gc:rgba(var(--ar),.8);animation:glw 2.6s ease-in-out infinite}
/* বহমান গ্রেডিয়েন্ট বর্ডার ও লেখা */
.hp-next::before,.hp-acc::before{background:linear-gradient(120deg,var(--a),transparent 30%,#1fd1a5 60%,transparent 80%,var(--a));background-size:300% 300%;animation:hfFlow 6s linear infinite}
.ftx{background:linear-gradient(90deg,#fff,var(--a),#fff,#7af0cf,#fff);background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:hfTxt 7s linear infinite;text-shadow:none!important;filter:drop-shadow(0 0 12px rgba(var(--ar),.45))}
/* চার্ট আঁকা, বার বাড়া, লিস্ট ফেড */
.cht polyline{stroke-dasharray:1;animation:fxDraw 1.3s cubic-bezier(.3,.7,.2,1) both}
.cht circle{animation:fxFade .6s 1s backwards}
.bar i{animation:fxGrow 1.2s cubic-bezier(.2,.8,.2,1) backwards}
.li{animation:fxFade .5s ease backwards;transition:transform .2s ease,box-shadow .2s ease,background .3s}
.na .li,.na .bar i,.na .cht circle{animation:none}
.na .cht polyline{animation:none;stroke-dasharray:none}
/* নেভ আইকন পপ */
#nav:not(.na) button.on svg{animation:fxPop .38s ease}
/* মোডাল: নিচ থেকে স্লাইড */
#ov.s{animation:fxFade .2s ease}
.box{animation:fxSheet .38s cubic-bezier(.2,.8,.2,1) backwards!important}
/* এআই টাইলে আলোর সোয়াইপ */
.tile[data-a="go:ai"]::after{content:"";position:absolute;top:0;bottom:0;width:36px;left:-40px;background:linear-gradient(90deg,transparent,rgba(var(--ar),.4),transparent);animation:hfSweep 3.4s ease-in-out infinite;pointer-events:none}
/* হোভার লিফট (পিসি) */
.tile,.pill,.ghost{transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease,background .3s}
@media(hover:hover){.tile:hover,.li:hover,.ghost:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(224,169,59,.28);border-color:rgba(var(--ar),.6)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

/* ===== পারফরম্যান্স: ভারী ইফেক্ট হালকা করা (শুধু transform/opacity অ্যানিমেশন) ===== */
.o{animation:none!important}
body::after{display:none!important}
.gl{animation:fxFloat 5.5s ease-in-out infinite!important;filter:drop-shadow(0 0 8px rgba(var(--ar),.7));will-change:transform}
.gb,.gbo{animation:none!important;box-shadow:0 0 14px var(--gc),inset 0 0 8px var(--gc2)}
.gb svg{animation:none!important;filter:drop-shadow(0 0 4px currentColor)}
.ib{animation:none!important;box-shadow:0 0 12px rgba(var(--ar),.22)}
.btn{background:linear-gradient(135deg,var(--a1),var(--a2))!important;background-size:auto!important;animation:none!important}
.btn.pl{animation:pl 2.4s infinite!important}
.hp-next::before,.hp-acc::before{animation:none!important;background-size:auto}
.ftx{animation:none!important;filter:none!important;background:linear-gradient(90deg,#fff,var(--a) 55%,#fff);-webkit-background-clip:text;background-clip:text}
.hp-next svg{animation:none!important;filter:drop-shadow(0 0 6px rgba(var(--ar),.6))}
.hp-next .pulse{animation:none!important}
@keyframes fxShine2{0%{transform:translateX(-120%) skewX(-18deg)}38%,100%{transform:translateX(420%) skewX(-18deg)}}
.shn::after{left:0!important;animation:fxShine2 5.5s ease-in-out 1.2s infinite!important;will-change:transform}
@keyframes hfScan2{0%{transform:translateY(-50%);opacity:0}15%,85%{opacity:.9}100%{transform:translateY(50%);opacity:0}}
.scn::after{top:0!important;height:auto!important;bottom:0;background:linear-gradient(transparent 49.2%,rgba(var(--ar),.9) 50%,transparent 50.8%)!important;animation:hfScan2 3.2s linear infinite!important;will-change:transform}
.tile[data-a="go:ai"]::after{display:none!important}
@media(max-width:899px){.g,#nav{-webkit-backdrop-filter:blur(12px)!important;backdrop-filter:blur(12px)!important}}
/* কম শক্তির ফোনে: ঝাপসা ব্যাকগ্রাউন্ড ও চলমান অ্যানিমেশন বন্ধ */
.lite .g{-webkit-backdrop-filter:none!important;backdrop-filter:none!important;background:var(--gbg)!important}
.lite .g{--gbg:radial-gradient(120% 90% at 100% 0%,rgba(var(--ar),.2),transparent 55%),radial-gradient(90% 80% at 0% 100%,rgba(var(--ar),.09),transparent 60%),linear-gradient(150deg,var(--c1),var(--c2))}
.lite .o{display:none}
.lite *,.lite *::before,.lite *::after{animation-iteration-count:1!important}
/* ===== সব থিমের ভেতরের রঙ: গাঢ়, তবে গভীরতা ও আলোর ছোঁয়াসহ ===== */
.o1{opacity:.28}.o2{opacity:.18}.o3{opacity:.24}
.g{--gbg:radial-gradient(120% 90% at 100% 0%,rgba(var(--ar),.2),transparent 55%),radial-gradient(90% 80% at 0% 100%,rgba(var(--ar),.09),transparent 60%),linear-gradient(150deg,var(--c1a),var(--c2a));background:var(--gbg)!important;-webkit-backdrop-filter:blur(18px) saturate(165%);backdrop-filter:blur(18px) saturate(165%);box-shadow:0 14px 40px rgba(0,0,0,.45),0 0 36px rgba(var(--ar),.1),inset 0 1px 0 rgba(255,255,255,.1)}
.g::before{background:linear-gradient(135deg,rgba(var(--ar),.7),rgba(var(--ar),.07) 38%,rgba(var(--ar),.07) 62%,rgba(var(--ar),.4))}
.hp-next{background:radial-gradient(circle at 90% 0%,rgba(var(--ar),.34),transparent 52%),radial-gradient(circle at 0% 100%,rgba(var(--ar),.14),transparent 55%),linear-gradient(135deg,var(--t1),var(--c2))!important;box-shadow:0 14px 40px rgba(0,0,0,.45),0 0 44px rgba(var(--ar),.22),inset 0 1px 0 rgba(255,255,255,.14)!important}
.tile,.li,.pill,.ghost,.pt,.th,.ct span,.fbox{background:radial-gradient(110% 130% at 0% 0%,rgba(var(--ar),.15),transparent 62%),linear-gradient(160deg,var(--t1),var(--t2));border:1px solid rgba(var(--ar),.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
input,select,textarea{background:var(--ib);border:1px solid rgba(var(--ar),.34)}
.box{background:radial-gradient(120% 80% at 100% 0%,rgba(var(--ar),.18),transparent 55%),var(--bx)!important;border:1px solid rgba(var(--ar),.4);box-shadow:0 0 50px rgba(var(--ar),.16)}

.pt.on,.th.on,.ct input:checked+span{border-color:var(--a);box-shadow:0 0 0 1px var(--a),0 0 18px rgba(var(--ar),.4)}

let curTh='gp',gTh='gp';
function myTh(){try{const m=LS.getItem('myTheme');return TH[m]?m:''}catch(e){return ''}}
function refreshTheme(){applyTheme(myTh()||gTh)}
function hmixa(x,y,w,al){return hmix(x,y,w).replace('rgb(','rgba(').replace(')',','+al+')')}
function hmix(x,y,w){const f=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16)),A=f(x),B=f(y);return'rgb('+A.map((v,i)=>Math.round(v*(1-w)+B[i]*w)).join(',')+')'}
function applyTheme(id,save){if(!TH[id])id='gp';if(id=='gp'&&isDark())id='gpd';if(id=='gpd'&&!isDark())id='gp';const t=TH[id],r=document.documentElement.style;['a','a1','a2','bt','ar','bg0','bgi','o1','o2','o3','tc','tcr','fs'].forEach(k=>r.setProperty('--'+k,t[k]));r.setProperty('--c1a',hmixa(t.bg0,t.tc,.8,.8));r.setProperty('--c2a',hmixa(t.bg0,t.tc,.35,.88));r.setProperty('--c1',hmix(t.bg0,t.tc,.8));r.setProperty('--c2',hmix(t.bg0,t.tc,.35));r.setProperty('--t1',hmix(t.tc,t.a,.1));r.setProperty('--t2',hmix(t.bg0,t.tc,.55));r.setProperty('--ib',hmix(t.bg0,t.tc,.3));r.setProperty('--bx',hmix(t.bg0,t.tc,.7));r.setProperty('--hg','linear-gradient(180deg,'+hmix(t.bg0,t.tc,.8)+' 0,'+hmix(t.tc,t.o1,.25)+' 60%,'+hmix(t.bg0,t.a,.12)+' 100%)');curTh=id;document.documentElement.dataset.th=id;const m=document.querySelector('meta[name=theme-color]');if(m)m.content=t.fs}
gTh=TH[LS.getItem('theme')]?LS.getItem('theme'):'gp';refreshTheme();

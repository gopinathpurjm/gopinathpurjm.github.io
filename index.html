}

@keyframes fxSheet{from{transform:translateY(46px);opacity:0}to{transform:none;opacity:1}}
@keyframes fxDraw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fxGrow{from{width:0}}
@keyframes fxShine{0%{left:-60%}38%,100%{left:135%}}
@keyframes fxRingG{0%{box-shadow:0 0 0 0 rgba(var(--ar),.5),0 0 16px rgba(var(--ar),.25)}100%{box-shadow:0 0 0 14px rgba(var(--ar),0),0 0 16px rgba(var(--ar),.25)}}
@keyframes fxShift{to{background-position:200% 0}}
@keyframes hfScan{0%{top:0;opacity:0}15%{opacity:.9}85%{opacity:.9}100%{top:100%;opacity:0}}
@keyframes hfBl{50%{opacity:.25}}
@keyframes hfSweep{0%{left:-40px}60%,100%{left:105%}}
@keyframes hfFlow{to{background-position:300% 0}}
@keyframes hfTxt{to{background-position:200% center}}
/* পেজ খোলার ঢেউ: মেইন কার্ড */
main>*{animation-name:fxUp}
/* ব্যাকগ্রাউন্ডে হালকা সোনালি গ্রিড */
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;background-image:linear-gradient(rgba(var(--ar),.07) 1px,transparent 1px),linear-gradient(90deg,rgba(var(--ar),.07) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(circle at 50% 0,#000,transparent 72%);mask-image:radial-gradient(circle at 50% 0,#000,transparent 72%)}
/* শাইন, ভাসা, রিং */
.shn{position:relative;overflow:hidden}
.shn::after{content:"";position:absolute;top:0;left:-60%;width:38%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.18),transparent);transform:skewX(-18deg);animation:fxShine 5.5s ease-in-out 1.2s infinite;pointer-events:none}
.gl{animation:glw 2.6s ease-in-out infinite,fxFloat 5.5s ease-in-out infinite}
.ib{animation:fxRingG 2.8s ease-out infinite}
.btn{background:linear-gradient(110deg,var(--a1),var(--a2),var(--a1),var(--a2))!important;background-size:200% 100%!important;animation:fxShift 5s linear infinite}
.btn.pl{animation:fxShift 5s linear infinite,pl 2.4s infinite}
/* নেক্সট নামাজ কার্ড: গ্রিড, কোণা, স্ক্যান লাইন, ব্লিঙ্ক ডট */
.scn{overflow:hidden}
.scn::after{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--a),transparent);animation:hfScan 3.2s linear infinite;pointer-events:none}
.gr{position:absolute;inset:0;border-radius:inherit;pointer-events:none;background-image:linear-gradient(rgba(var(--ar),.12) 1px,transparent 1px),linear-gradient(90deg,rgba(var(--ar),.12) 1px,transparent 1px);background-size:16px 16px;-webkit-mask-image:linear-gradient(120deg,#000,transparent 75%);mask-image:linear-gradient(120deg,#000,transparent 75%)}
.cb{position:absolute;width:16px;height:16px;border:2px solid var(--a);opacity:.85;pointer-events:none}
.cb.tl{left:10px;top:10px;border-right:0;border-bottom:0;border-radius:6px 0 0 0}
.cb.br{right:10px;bottom:10px;border-left:0;border-top:0;border-radius:0 0 6px 0}
.bk{display:inline-block;width:7px;height:7px;border-radius:50%;background:#19e68c;box-shadow:0 0 8px #19e68c;margin-right:6px;animation:hfBl 1.6s ease-in-out infinite}
.hp-next svg{--gc:rgba(var(--ar),.8);animation:glw 2.6s ease-in-out infinite}
/* বহমান গ্রেডিয়েন্ট বর্ডার ও লেখা */
.hp-next::before,.hp-acc::before{background:linear-gradient(120deg,var(--a),transparent 30%,#1fd1a5 60%,transparent 80%,var(--a));background-size:300% 300%;animation:hfFlow 6s linear infinite}
.ftx{background:linear-gradient(90deg,#fff,var(--a),#fff,#7af0cf,#fff);background-size:200% auto;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:hfTxt 7s linear infinite;text-shadow:none!important;filter:drop-shadow(0 0 12px rgba(var(--ar),.45))}
/* চার্ট আঁকা, বার বাড়া, লিস্ট ফেড */
.cht polyline{stroke-dasharray:1;animation:fxDraw 1.3s cubic-bezier(.3,.7,.2,1) both}
.cht circle{animation:fxFade .6s 1s backwards}
.bar i{animation:fxGrow 1.2s cubic-bezier(.2,.8,.2,1) backwards}
.li{animation:fxFade .5s ease backwards;transition:transform .2s ease,box-shadow .2s ease,background .3s}
.na .li,.na .bar i,.na .cht circle{animation:none}
.na .cht polyline{animation:none;stroke-dasharray:none}
/* নেভ আইকন পপ */
#nav:not(.na) button.on svg{animation:fxPop .38s ease}
/* মোডাল: নিচ থেকে স্লাইড */
#ov.s{animation:fxFade .2s ease}
.box{animation:fxSheet .38s cubic-bezier(.2,.8,.2,1) backwards!important}
/* এআই টাইলে আলোর সোয়াইপ */
.tile[data-a="go:ai"]::after{content:"";position:absolute;top:0;bottom:0;width:36px;left:-40px;background:linear-gradient(90deg,transparent,rgba(var(--ar),.4),transparent);animation:hfSweep 3.4s ease-in-out infinite;pointer-events:none}
/* হোভার লিফট (পিসি) */
.tile,.pill,.ghost{transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease,background .3s}
@media(hover:hover){.tile:hover,.li:hover,.ghost:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(224,169,59,.28);border-color:rgba(var(--ar),.6)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

/* ===== পারফরম্যান্স: ভারী ইফেক্ট হালকা করা (শুধু transform/opacity অ্যানিমেশন) ===== */
.o{animation:none!important}
body::after{display:none!important}
.gl{animation:fxFloat 5.5s ease-in-out infinite!important;filter:drop-shadow(0 0 8px rgba(var(--ar),.7));will-change:transform}
.gb,.gbo{animation:none!important;box-shadow:0 0 14px var(--gc),inset 0 0 8px var(--gc2)}
.gb svg{animation:none!important;filter:drop-shadow(0 0 4px currentColor)}
.ib{animation:none!important;box-shadow:0 0 12px rgba(var(--ar),.22)}
.btn{background:linear-gradient(135deg,var(--a1),var(--a2))!important;background-size:auto!important;animation:none!important}
.btn.pl{animation:pl 2.4s infinite!important}
.hp-next::before,.hp-acc::before{animation:none!important;background-size:auto}
.ftx{animation:none!important;filter:none!important;background:linear-gradient(90deg,#fff,var(--a) 55%,#fff);-webkit-background-clip:text;background-clip:text}
.hp-next svg{animation:none!important;filter:drop-shadow(0 0 6px rgba(var(--ar),.6))}
.hp-next .pulse{animation:none!important}
@keyframes fxShine2{0%{transform:translateX(-120%) skewX(-18deg)}38%,100%{transform:translateX(420%) skewX(-18deg)}}
.shn::after{left:0!important;animation:fxShine2 5.5s ease-in-out 1.2s infinite!important;will-change:transform}
@keyframes hfScan2{0%{transform:translateY(-50%);opacity:0}15%,85%{opacity:.9}100%{transform:translateY(50%);opacity:0}}
.scn::after{top:0!important;height:auto!important;bottom:0;background:linear-gradient(transparent 49.2%,rgba(var(--ar),.9) 50%,transparent 50.8%)!important;animation:hfScan2 3.2s linear infinite!important;will-change:transform}
.tile[data-a="go:ai"]::after{display:none!important}
@media(max-width:899px){.g,#nav{-webkit-backdrop-filter:blur(12px)!important;backdrop-filter:blur(12px)!important}}
/* কম শক্তির ফোনে: ঝাপসা ব্যাকগ্রাউন্ড ও চলমান অ্যানিমেশন বন্ধ */
.lite .g{-webkit-backdrop-filter:none!important;backdrop-filter:none!important;background:var(--gbg)!important}
.lite .g{--gbg:radial-gradient(120% 90% at 100% 0%,rgba(var(--ar),.2),transparent 55%),radial-gradient(90% 80% at 0% 100%,rgba(var(--ar),.09),transparent 60%),linear-gradient(150deg,var(--c1),var(--c2))}
.lite .o{display:none}
.lite *,.lite *::before,.lite *::after{animation-iteration-count:1!important}
/* ===== সব থিমের ভেতরের রঙ: গাঢ়, তবে গভীরতা ও আলোর ছোঁয়াসহ ===== */
.o1{opacity:.28}.o2{opacity:.18}.o3{opacity:.24}
.g{--gbg:radial-gradient(120% 90% at 100% 0%,rgba(var(--ar),.2),transparent 55%),radial-gradient(90% 80% at 0% 100%,rgba(var(--ar),.09),transparent 60%),linear-gradient(150deg,var(--c1a),var(--c2a));background:var(--gbg)!important;-webkit-backdrop-filter:blur(18px) saturate(165%);backdrop-filter:blur(18px) saturate(165%);box-shadow:0 14px 40px rgba(0,0,0,.45),0 0 36px rgba(var(--ar),.1),inset 0 1px 0 rgba(255,255,255,.1)}
.g::before{background:linear-gradient(135deg,rgba(var(--ar),.7),rgba(var(--ar),.07) 38%,rgba(var(--ar),.07) 62%,rgba(var(--ar),.4))}
.hp-next{background:radial-gradient(circle at 90% 0%,rgba(var(--ar),.34),transparent 52%),radial-gradient(circle at 0% 100%,rgba(var(--ar),.14),transparent 55%),linear-gradient(135deg,var(--t1),var(--c2))!important;box-shadow:0 14px 40px rgba(0,0,0,.45),0 0 44px rgba(var(--ar),.22),inset 0 1px 0 rgba(255,255,255,.14)!important}
.tile,.li,.pill,.ghost,.pt,.th,.ct span,.fbox{background:radial-gradient(110% 130% at 0% 0%,rgba(var(--ar),.15),transparent 62%),linear-gradient(160deg,var(--t1),var(--t2));border:1px solid rgba(var(--ar),.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
input,select,textarea{background:var(--ib);border:1px solid rgba(var(--ar),.34)}

let curTh='gp',gTh='gp';
function myTh(){try{const m=LS.getItem('myTheme');return TH[m]?m:''}catch(e){return ''}}
function refreshTheme(){applyTheme(myTh()||gTh)}
function hmixa(x,y,w,al){return hmix(x,y,w).replace('rgb(','rgba(').replace(')',','+al+')')}
function hmix(x,y,w){const f=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16)),A=f(x),B=f(y);return'rgb('+A.map((v,i)=>Math.round(v*(1-w)+B[i]*w)).join(',')+')'}
function applyTheme(id,save){if(!TH[id])id='gp';if(id=='gp'&&isDark())id='gpd';if(id=='gpd'&&!isDark())id='gp';const t=TH[id],r=document.documentElement.style;['a','a1','a2','bt','ar','bg0','bgi','o1','o2','o3','tc','tcr','fs'].forEach(k=>r.setProperty('--'+k,t[k]));r.setProperty('--c1a',hmixa(t.bg0,t.tc,.8,.8));r.setProperty('--c2a',hmixa(t.bg0,t.tc,.35,.88));r.setProperty('--c1',hmix(t.bg0,t.tc,.8));r.setProperty('--c2',hmix(t.bg0,t.tc,.35));r.setProperty('--t1',hmix(t.tc,t.a,.1));r.setProperty('--t2',hmix(t.bg0,t.tc,.55));r.setProperty('--ib',hmix(t.bg0,t.tc,.3));r.setProperty('--bx',hmix(t.bg0,t.tc,.7));r.setProperty('--hg','linear-gradient(180deg,'+hmix(t.bg0,t.tc,.8)+' 0,'+hmix(t.tc,t.o1,.25)+' 60%,'+hmix(t.bg0,t.a,.12)+' 100%)');curTh=id;document.documentElement.dataset.th=id;const m=document.querySelector('meta[name=theme-color]');if(m)m.content=t.fs}
gTh=TH[LS.getItem('theme')]?LS.getItem('theme'):'gp';refreshTheme();
